name: Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: template-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Enable the package manager pinned by package.json
        run: corepack enable pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the distributable
        run: pnpm build

      - name: Verify the emitted Canvas module
        run: pnpm test

      - name: Checkout the canonical validator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: MyWallpapers/native-addon-toolchain
          ref: 5cb93ac836299df0caff42426da5c80fd8ce7c32
          path: .toolchain
          persist-credentials: false

      - name: Validate the complete add-on contract
        shell: pwsh
        run: |
          & .toolchain/.github/scripts/expand-canonical-cli.ps1 -ArtifactRoot .toolchain/.github/canonical-cli -Destination "$env:RUNNER_TEMP/addon-cli"
          node "$env:RUNNER_TEMP/addon-cli/cli/dist/bin.js" check --json --directory .
          if ($LASTEXITCODE -ne 0) { throw 'Canonical add-on validation failed' }
